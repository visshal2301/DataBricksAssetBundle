# This is a Databricks asset bundle definition for hospital_data.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: hospital_data
  uuid: ba5ee723-cd55-40ff-8442-10db5eb855bc

include:
  - resources/*.yml
  - resources/*/*.yml



# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-7c64d739-3c54.cloud.databricks.com
    variables:
      catalog: workspace
      schema: ${workspace.current_user.short_name}
  prod:
    mode: production
    workspace:
      host: https://dbc-7c64d739-3c54.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/padaialgo@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/padaialgo@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: workspace
      schema: prod
    permissions:
      - user_name: padaialgo@gmail.com
        level: CAN_MANAGE
